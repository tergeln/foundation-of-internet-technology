<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 9 - Hangman тоглоом</title>
    <meta name="description" content="Үсэг таан нуугдсан үгийг олох Hangman тоглоом. HTML, CSS, JavaScript.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top">
        <h1>Hangman</h1>
        <p>Асуултыг уншаад, үсэг сонгон нуугдсан үгийг олоорой.</p>
    </header>

    <main class="game">

        <!-- Зүүн тал: хүний дүрс (SVG) -->
        <section class="board">
            <svg class="figure" viewBox="0 0 200 230" aria-label="Hangman дүрс">
                <!-- Дүүжлүүр: үргэлж харагдана -->
                <line x1="20"  y1="215" x2="120" y2="215" class="gallows"/>
                <line x1="50"  y1="215" x2="50"  y2="20"  class="gallows"/>
                <line x1="50"  y1="20"  x2="140" y2="20"  class="gallows"/>
                <line x1="140" y1="20"  x2="140" y2="45"  class="rope"/>

                <!-- Хүний 5 хэсэг: алдаа бүрд нэг нэгээр гарна -->
                <circle cx="140" cy="65" r="20"            class="part"/>   <!-- 1. толгой -->
                <line x1="140" y1="85"  x2="140" y2="145"  class="part"/>   <!-- 2. бие -->
                <g class="part">                                             <!-- 3. гар -->
                    <line x1="140" y1="100" x2="112" y2="128"/>
                    <line x1="140" y1="100" x2="168" y2="128"/>
                </g>
                <line x1="140" y1="145" x2="115" y2="185"  class="part"/>   <!-- 4. зүүн хөл -->
                <line x1="140" y1="145" x2="165" y2="185"  class="part"/>   <!-- 5. баруун хөл -->
            </svg>

            <div class="lives">
                Үлдсэн амь: <span id="lives-count">5</span>
                <div id="hearts" class="hearts" aria-hidden="true"></div>
            </div>
        </section>

        <!-- Баруун тал: асуулт, үг, мэдээлэл, үсгүүд -->
        <section class="play">
            <p class="label">Асуулт</p>
            <h2 id="question" class="question"></h2>

            <div id="word" class="word" aria-live="polite"></div>

            <p id="message" class="message" aria-live="polite">Үсгээ сонгоно уу.</p>

            <div id="keyboard" class="keyboard"></div>

            <button id="restart" class="restart" type="button">Шинэ тоглоом</button>
        </section>

    </main>

    <!-- Тоглоом дуусахад гарах цонх -->
    <div id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="result-box">
            <h2 id="result-title"></h2>
            <p>Зөв хариулт: <strong id="result-answer"></strong></p>
            <button id="play-again" class="restart" type="button">Дахин тоглох</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
